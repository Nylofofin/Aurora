name: Desktop checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system audio runtime
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libpulse0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile, test, and validate shell scripts
        run: scripts/check-desktop-release.sh
